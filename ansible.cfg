[defaults]
# Tell Ansible where to find your custom callback
callback_plugins  = ./callback_plugins

# loki_push is the only observability callback needed now.
# log_plays kept for local debug file on whatever node runs the playbook.
callbacks_enabled = loki_push, log_plays, timer

# Local debug log — useful on the Morpheus node itself, not part of the
# observability pipeline. Safe to remove if you don't want it.
log_path = /var/log/ansible/sail.log

host_key_checking = False

[callback_loki_push]
# Direct push to Loki — HA-safe, no shared filesystem involved.
loki_url    = http://10.202.52.109:3100
loki_timeout = 5

# Explicitly bypass the corporate proxy for Loki.
# urllib (used by the callback) does not support CIDR in no_proxy,
# so the explicit IP is required here even if 10.0.0.0/8 is set system-wide.
no_proxy = 10.202.52.109

[callback_log_plays]
log_folder = /var/log/ansible/hosts
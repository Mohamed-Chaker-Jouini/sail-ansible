[defaults]
# Morpheus runs Ansible from the repo root, so this relative path resolves
# correctly on every node regardless of where the repo is cloned.
callback_plugins  = ./callback_plugins

# log_plays removed — Morpheus runs as morpheus-local which has no write
# access to /var/log/ansible. loki_push handles all observability instead.
callbacks_enabled = loki_push, timer

host_key_checking = False

[callback_loki_push]
loki_url     = http://10.202.52.109:3100
loki_timeout = 5
# urllib does not honour CIDR in no_proxy — explicit IP required.
no_proxy     = 10.202.52.109
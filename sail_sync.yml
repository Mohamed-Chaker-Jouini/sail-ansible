---
- name: Phase 1 — Gather desired state from Morpheus
  hosts: localhost
  gather_facts: no
  tasks:

    - name: Add vSRX to inventory
      add_host:
        name: vsrx
        ansible_host: "{{ vsrx_ip }}"
        ansible_user: root
        ansible_password: "{{ vsrx_password }}"
        ansible_connection: netconf
        ansible_network_os: junos
        ansible_netconf_port: 830

    - name: Query Morpheus for all AppTier-tagged instances
      uri:
        url: "https://{{ morpheus_ip }}/api/instances?tagName=AppTier&max=500"
        method: GET
        headers:
          Authorization: "Bearer {{ morpheus_token }}"
        validate_certs: no
      register: morpheus_result

    - name: Build desired IP lists
      set_fact:
        web_ips: "{{ morpheus_result.json | json_query(web_q) | reject('none') | list }}"
        db_ips:  "{{ morpheus_result.json | json_query(db_q)  | reject('none') | list }}"
      vars:
        web_q: "instances[?tags[?name=='AppTier' && value=='Web']].connectionInfo[0].ip"
        db_q:  "instances[?tags[?name=='AppTier' && value=='DB']].connectionInfo[0].ip"

    - name: Pass IP lists to vsrx
      add_host:
        name: vsrx
        web_ips: "{{ web_ips }}"
        db_ips:  "{{ db_ips }}"

    - name: Debug desired state
      debug:
        msg: { "WEB": "{{ web_ips }}", "DB": "{{ db_ips }}" }


- name: Phase 2 — Read actual state from SRX
  hosts: vsrx
  gather_facts: no
  collections:
    - junipernetworks.junos

  tasks:

    - name: Read current MORPHEUS_MANAGED address-book from SRX
      junipernetworks.junos.junos_command:
        commands:
          - "show configuration security address-book MORPHEUS_MANAGED"
      register: srx_raw

    - name: Parse current SRX address-set members
      set_fact:
        srx_web_ips: >-
          {{
            srx_raw.stdout[0]
            | regex_findall('address-set SET_WEB \{([^}]*)\}', multiline=True)
            | first | default('')
            | regex_findall('address (\d+\.\d+\.\d+\.\d+);')
          }}
        srx_db_ips: >-
          {{
            srx_raw.stdout[0]
            | regex_findall('address-set SET_DB \{([^}]*)\}', multiline=True)
            | first | default('')
            | regex_findall('address (\d+\.\d+\.\d+\.\d+);')
          }}

    - name: Compute deltas
      set_fact:
        web_to_add:    "{{ web_ips | difference(srx_web_ips) }}"
        web_to_remove: "{{ srx_web_ips | difference(web_ips) }}"
        db_to_add:     "{{ db_ips  | difference(srx_db_ips) }}"
        db_to_remove:  "{{ srx_db_ips | difference(db_ips) }}"

    - name: Debug deltas
      debug:
        msg:
          - "WEB add={{ web_to_add }} remove={{ web_to_remove }}"
          - "DB  add={{ db_to_add  }} remove={{ db_to_remove }}"

    - name: Pass deltas back to localhost for topology writer
      add_host:
        name: localhost
        web_to_add:    "{{ web_to_add }}"
        web_to_remove: "{{ web_to_remove }}"
        db_to_add:     "{{ db_to_add }}"
        db_to_remove:  "{{ db_to_remove }}"


- name: Phase 3 — Enforce desired state on SRX
  hosts: vsrx
  gather_facts: no
  collections:
    - junipernetworks.junos

  tasks:

    - name: Add new WEB IPs
      junipernetworks.junos.junos_config:
        lines:
          - "set security address-book MORPHEUS_MANAGED address {{ item }} {{ item }}/32"
          - "set security address-book MORPHEUS_MANAGED address-set SET_WEB address {{ item }}"
      loop: "{{ web_to_add }}"
      when: web_to_add | length > 0

    - name: Add new DB IPs
      junipernetworks.junos.junos_config:
        lines:
          - "set security address-book MORPHEUS_MANAGED address {{ item }} {{ item }}/32"
          - "set security address-book MORPHEUS_MANAGED address-set SET_DB address {{ item }}"
      loop: "{{ db_to_add }}"
      when: db_to_add | length > 0

    - name: Remove stale WEB IPs
      junipernetworks.junos.junos_config:
        lines:
          - "delete security address-book MORPHEUS_MANAGED address-set SET_WEB address {{ item }}"
          - "delete security address-book MORPHEUS_MANAGED address {{ item }}"
      loop: "{{ web_to_remove }}"
      when: web_to_remove | length > 0

    - name: Remove stale DB IPs
      junipernetworks.junos.junos_config:
        lines:
          - "delete security address-book MORPHEUS_MANAGED address-set SET_DB address {{ item }}"
          - "delete security address-book MORPHEUS_MANAGED address {{ item }}"
      loop: "{{ db_to_remove }}"
      when: db_to_remove | length > 0

    - name: No-op confirmation
      debug:
        msg: "Zero-impact run — SRX already matches Morpheus desired state."
      when:
        - web_to_add | length == 0
        - web_to_remove | length == 0
        - db_to_add | length == 0
        - db_to_remove | length == 0

    - name: Validate — show final SRX address-book
      junipernetworks.junos.junos_command:
        commands:
          - "show configuration security address-book MORPHEUS_MANAGED"
      register: validation

    - name: Print final SRX state
      debug:
        msg: "{{ validation.stdout_lines }}"


- name: Phase 4 — Write topology snapshot for Grafana
  hosts: localhost
  gather_facts: no

  tasks:

    - name: Ensure topology directory exists
      file:
        path: /topology
        state: directory
        mode: '0755'

    - name: Write topology.json
      copy:
        dest: /topology/topology.json
        content: "{{ topology | to_nice_json }}"
      vars:
        srx_node:
          - id: "srx"
            title: "vSRX"
            subTitle: "{{ vsrx_ip }}"
            mainStat: "Firewall"
            color: "orange"

        zone_nodes:
          - id: "zone_web"
            title: "SET_WEB"
            subTitle: "Web Tier"
            mainStat: "{{ web_ips | length }} VMs"
            color: "blue"
          - id: "zone_db"
            title: "SET_DB"
            subTitle: "DB Tier"
            mainStat: "{{ db_ips | length }} VMs"
            color: "purple"

        web_nodes: >-
          {{ web_ips | map('community.general.dict_kv', 'id')
             | map('combine', {'subTitle': 'Web VM'})
             | list }}

        # Build node list per IP with drift awareness
        web_vm_nodes: >-
          [
          {% for ip in web_ips %}
          {
            "id": "{{ ip }}",
            "title": "{{ ip }}",
            "subTitle": "Web VM",
            "mainStat": "{{ 'DRIFT FIXED' if ip in web_to_add else 'IN SYNC' }}",
            "color": "{{ 'red' if ip in web_to_add else 'green' }}"
          }{% if not loop.last %},{% endif %}
          {% endfor %}
          ]

        db_vm_nodes: >-
          [
          {% for ip in db_ips %}
          {
            "id": "{{ ip }}",
            "title": "{{ ip }}",
            "subTitle": "DB VM",
            "mainStat": "{{ 'DRIFT FIXED' if ip in db_to_add else 'IN SYNC' }}",
            "color": "{{ 'red' if ip in db_to_add else 'green' }}"
          }{% if not loop.last %},{% endif %}
          {% endfor %}
          ]

        srx_to_zone_edges:
          - { id: "srx-web", source: "srx",      target: "zone_web" }
          - { id: "srx-db",  source: "srx",      target: "zone_db"  }

        web_edges: >-
          [
          {% for ip in web_ips %}
          { "id": "web-{{ ip }}", "source": "zone_web", "target": "{{ ip }}" }{% if not loop.last %},{% endif %}
          {% endfor %}
          ]

        db_edges: >-
          [
          {% for ip in db_ips %}
          { "id": "db-{{ ip }}", "source": "zone_db", "target": "{{ ip }}" }{% if not loop.last %},{% endif %}
          {% endfor %}
          ]

        topology:
          nodes: "{{ srx_node + zone_nodes + web_vm_nodes + db_vm_nodes }}"
          edges: "{{ srx_to_zone_edges + web_edges + db_edges }}"
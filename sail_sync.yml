---
- name: Setup dynamic inventory and gather data
  hosts: localhost
  gather_facts: no

  vars:
    morpheus_url: "https://{{ morpheus_ip }}"

  tasks:

    - name: Add vSRX to inventory dynamically
      add_host:
        name: vsrx
        ansible_host: "{{ vsrx_ip }}"
        ansible_user: root
        ansible_password: "{{ vsrx_password }}"
        ansible_connection: netconf
        ansible_network_os: junos
        ansible_netconf_port: 830

    - name: Query Morpheus for ALL AppTier tagged VMs
      uri:
        # Fetching all instances that have the AppTier key. 
        # We will filter the specific Web/DB values client-side.
        url: "{{ morpheus_url }}/api/instances?tagName=AppTier&max=500"
        method: GET
        headers:
          Authorization: "Bearer {{ morpheus_token }}"
        validate_certs: no
      register: morpheus_result

    - name: Build precise IP lists via client-side JSON filtering
      set_fact:
        # json_query strictly checks the nested tags array for an exact name AND value match
        # reject('none') ensures we don't accidentally add null values if connectionInfo is empty
        web_ips: "{{ morpheus_result.json | json_query(web_query) | reject('none') | list }}"
        db_ips: "{{ morpheus_result.json | json_query(db_query) | reject('none') | list }}"
      vars:
        web_query: "instances[?tags[?name=='AppTier' && value=='Web']].connectionInfo[0].ip"
        db_query: "instances[?tags[?name=='AppTier' && value=='DB']].connectionInfo[0].ip"

    - name: Print validated IPs for debugging
      debug:
        msg:
          - "Strictly Filtered Web IPs: {{ web_ips }}"
          - "Strictly Filtered DB IPs: {{ db_ips }}"

    - name: Pass validated IP lists to vsrx host
      add_host:
        name: vsrx
        web_ips: "{{ web_ips }}"
        db_ips: "{{ db_ips }}"

- name: SAIL - Enforce state on SRX
  hosts: vsrx
  gather_facts: no
  collections:
    - junipernetworks.junos

  tasks:

    - name: Sync SET_WEB addresses to SRX
      junipernetworks.junos.junos_config:
        lines:
          - "set security address-book MORPHEUS_MANAGED address {{ item }} {{ item }}/32"
          - "set security address-book MORPHEUS_MANAGED address-set SET_WEB address {{ item }}"
        confirm: 1
      loop: "{{ web_ips }}"
      # Skip task if the list is empty to prevent Juniper commit errors
      when: web_ips | length > 0

    - name: Sync SET_DB addresses to SRX
      junipernetworks.junos.junos_config:
        lines:
          - "set security address-book MORPHEUS_MANAGED address {{ item }} {{ item }}/32"
          - "set security address-book MORPHEUS_MANAGED address-set SET_DB address {{ item }}"
        confirm: 1
      loop: "{{ db_ips }}"
      when: db_ips | length > 0

    - name: Validate - show current SRX address book
      junipernetworks.junos.junos_command:
        commands:
          - show configuration security address-book MORPHEUS_MANAGED
      register: validation

    - name: Print SRX state to log
      debug:
        msg: "{{ validation.stdout_lines }}"

---
# ─────────────────────────────────────────────────────────────────────────────
# SAIL — SRX / Morpheus reconciliation playbook
#
# Variables expected from Morpheus (set in the task / workflow inputs):
#   vsrx_ip         IP of the vSRX management interface
#   vsrx_password   root password for the vSRX
#   morpheus_ip     Morpheus appliance hostname or IP
#   morpheus_token  Morpheus Bearer token
#   fileserver_url  Base URL of the topology fileserver
#                   e.g. http://10.202.52.109:8880
# ─────────────────────────────────────────────────────────────────────────────


# ── Phase 1 ── Gather desired state from Morpheus ────────────────────────────
- name: Phase 1 — Gather desired state from Morpheus
  hosts: localhost
  gather_facts: no

  tasks:

    - name: Register vSRX in the in-memory inventory
      add_host:
        name: vsrx
        ansible_host:         "{{ vsrx_ip }}"
        ansible_user:         root
        ansible_password:     "{{ vsrx_password }}"
        ansible_connection:   netconf
        ansible_network_os:   junos
        ansible_netconf_port: 830

    - name: Query Morpheus for all AppTier-tagged instances
      uri:
        url: "https://{{ morpheus_ip }}/api/instances?tagName=AppTier&max=500"
        method: GET
        headers:
          Authorization: "Bearer {{ morpheus_token }}"
        validate_certs: no
      register: morpheus_result

    # Build a dynamic zone_map dict from whatever AppTier tag values exist.
    # Each unique tag value (e.g. Web, DB, App) becomes a zone key (uppercased)
    # mapped to the list of IPs carrying that tag.
    # Result shape: { "WEB": ["10.x.x.x", ...], "DB": ["10.x.x.x", ...], ... }
    - name: Build dynamic zone map from Morpheus response
      set_fact:
        zone_map: >-
          {{ zone_map | default({}) | combine({
               ( item.tags
                 | selectattr('name', 'equalto', 'AppTier')
                 | map(attribute='value')
                 | first
                 | upper ):
               ( zone_map | default({}) )[
                 item.tags
                 | selectattr('name', 'equalto', 'AppTier')
                 | map(attribute='value')
                 | first
                 | upper
               ] | default([]) + [ item.connectionInfo[0].ip ]
             })
          }}
      loop: "{{ morpheus_result.json.instances
                | selectattr('tags', 'defined')
                | selectattr('connectionInfo', 'defined')
                | list }}"
      when: >-
        ( item.tags
          | selectattr('name', 'equalto', 'AppTier')
          | list | length > 0 )
        and item.connectionInfo | length > 0
        and item.connectionInfo[0].ip is defined

    - name: Ensure zone_map is defined even when no tagged instances exist
      set_fact:
        zone_map: "{{ zone_map | default({}) }}"

    - name: Debug desired zone map
      debug:
        msg: "{{ zone_map }}"


# ── Phase 2 ── Read actual state from the SRX via NETCONF ────────────────────
- name: Phase 2 — Read actual state from SRX
  hosts: vsrx
  gather_facts: no
  collections:
    - ansible.netcommon
    - junipernetworks.junos

  tasks:

    - name: Fetch MORPHEUS_MANAGED address-book config via NETCONF get-config
      ansible.netcommon.netconf_get:
        source: running
        filter: |
          <configuration>
            <security>
              <address-book>
                <name>MORPHEUS_MANAGED</name>
              </address-book>
            </security>
          </configuration>
        display: xml
      register: srx_xml_raw

    # parse_srx_zone_map returns { "WEB": [...], "DB": [...], ... }
    # stripping SET_ prefixes so zone names match Morpheus tag values.
    - name: Parse XML into current zone map
      set_fact:
        srx_zone_map: "{{ srx_xml_raw.output | parse_srx_zone_map }}"

    # compute_deltas compares desired (Morpheus) vs current (SRX) and returns
    # { ZONE: { to_add: [...], to_remove: [...] } } for every zone in either map.
    - name: Compute per-zone deltas
      set_fact:
        delta_map: "{{ hostvars['localhost']['zone_map'] | compute_deltas(srx_zone_map) }}"

    - name: Debug deltas
      debug:
        msg: "{{ delta_map }}"


# ── Phase 2.5 ── Promote vsrx facts to localhost scope ───────────────────────
- name: Phase 2.5 — Promote vsrx deltas to localhost
  hosts: localhost
  gather_facts: no

  tasks:

    - name: Pull delta and zone facts from vsrx hostvars
      set_fact:
        delta_map:    "{{ hostvars['vsrx']['delta_map'] }}"
        srx_zone_map: "{{ hostvars['vsrx']['srx_zone_map'] }}"


# ── Phase 3 ── Enforce desired state on SRX ──────────────────────────────────
- name: Phase 3 — Enforce desired state on SRX
  hosts: vsrx
  gather_facts: no
  collections:
    - junipernetworks.junos

  tasks:

    # Add IPs to their address-set. Creates the address-set implicitly if new.
    # item.0 is the zone name (e.g. WEB), item.1 is the IP.
    - name: Add IPs to address-book and zone set
      junipernetworks.junos.junos_config:
        lines:
          - "set security address-book MORPHEUS_MANAGED address {{ item.1 }} {{ item.1 }}/32"
          - "set security address-book MORPHEUS_MANAGED address-set SET_{{ item.0.key }} address {{ item.1 }}"
      loop: "{{ delta_map | dict2items | subelements('value.to_add') }}"
      loop_control:
        label: "{{ item.0.key }} ← {{ item.1 }}"
      when: delta_map | dict2items | selectattr('value.to_add', 'ne', []) | list | length > 0

    # Apply a deny-all policy in both directions for brand-new zones only.
    # "Brand new" means the zone did not exist in the SRX address-book at all
    # before this run — i.e. it is absent from srx_zone_map.
    # This ensures a misconfigured tag never exposes a VM until a human
    # explicitly adds a permit policy.
    - name: Apply deny-all policy for brand-new zones
      junipernetworks.junos.junos_config:
        lines:
          # Outbound deny
          - "set security policies from-zone {{ item.key }}_ZONE to-zone untrust policy DENY_ALL_OUT_{{ item.key }} match source-address SET_{{ item.key }}"
          - "set security policies from-zone {{ item.key }}_ZONE to-zone untrust policy DENY_ALL_OUT_{{ item.key }} match destination-address any"
          - "set security policies from-zone {{ item.key }}_ZONE to-zone untrust policy DENY_ALL_OUT_{{ item.key }} match application any"
          - "set security policies from-zone {{ item.key }}_ZONE to-zone untrust policy DENY_ALL_OUT_{{ item.key }} then deny"
          # Inbound deny
          - "set security policies from-zone untrust to-zone {{ item.key }}_ZONE policy DENY_ALL_IN_{{ item.key }} match source-address any"
          - "set security policies from-zone untrust to-zone {{ item.key }}_ZONE policy DENY_ALL_IN_{{ item.key }} match destination-address SET_{{ item.key }}"
          - "set security policies from-zone untrust to-zone {{ item.key }}_ZONE policy DENY_ALL_IN_{{ item.key }} match application any"
          - "set security policies from-zone untrust to-zone {{ item.key }}_ZONE policy DENY_ALL_IN_{{ item.key }} then deny"
      loop: "{{ delta_map | dict2items
                | selectattr('value.to_add', 'ne', [])
                | list }}"
      loop_control:
        label: "{{ item.key }}"
      # Only fire when this zone was completely absent from the SRX before this run.
      when: item.key not in srx_zone_map

    # Remove stale IPs from their address-set then delete the address entry.
    - name: Remove stale IPs from address-book and zone set
      junipernetworks.junos.junos_config:
        lines:
          - "delete security address-book MORPHEUS_MANAGED address-set SET_{{ item.0.key }} address {{ item.1 }}"
          - "delete security address-book MORPHEUS_MANAGED address {{ item.1 }}"
      loop: "{{ delta_map | dict2items | subelements('value.to_remove') }}"
      loop_control:
        label: "{{ item.0.key }} → {{ item.1 }}"
      when: delta_map | dict2items | selectattr('value.to_remove', 'ne', []) | list | length > 0

    - name: No-op confirmation — SRX already matches desired state
      debug:
        msg: "Zero-impact run — SRX already matches Morpheus desired state."
      when: >-
        delta_map.values()
        | map(attribute='to_add')    | flatten | length == 0
        and delta_map.values()
        | map(attribute='to_remove') | flatten | length == 0


# ── Phase 4 ── Build and publish topology snapshot for Grafana ───────────────
- name: Phase 4 — Publish topology snapshot
  hosts: localhost
  connection: local
  gather_facts: no

  tasks:

    # build_topology accepts (zone_map, delta_map, vsrx_ip) and returns
    # { nodes: [...], edges: [...] } ready for the Grafana node-graph panel.
    - name: Build topology dict
      set_fact:
        topology: >-
          {{ (zone_map, delta_map, vsrx_ip) | build_topology }}

    - name: Push topology.json to fileserver via HTTP PUT
      uri:
        url:         "{{ fileserver_url }}/topology.json"
        method:      PUT
        body:        "{{ topology | to_nice_json }}"
        body_format: raw
        headers:
          Content-Type: application/json
        validate_certs: no
        status_code:   [200, 201, 204]
        use_proxy:     no

    - name: Confirm topology published
      debug:
        msg: "Topology pushed to {{ fileserver_url }}/topology.json"
---
# ─────────────────────────────────────────────────────────────────────────────
# SAIL — SRX / Morpheus reconciliation playbook
#
# Variables expected from Morpheus (set in the task / workflow inputs):
#   vsrx_ip         IP of the vSRX management interface
#   vsrx_password   root password for the vSRX
#   morpheus_ip     Morpheus appliance hostname or IP
#   morpheus_token  Morpheus Bearer token
#   fileserver_url  Base URL of the topology fileserver
#                   e.g. http://10.202.52.109:8880
# ─────────────────────────────────────────────────────────────────────────────


# ── Phase 1 ── Gather desired state from Morpheus ────────────────────────────
- name: Phase 1 — Gather desired state from Morpheus
  hosts: localhost
  gather_facts: no

  tasks:

    - name: Register vSRX in the in-memory inventory
      add_host:
        name: vsrx
        ansible_host:         "{{ vsrx_ip }}"
        ansible_user:         root
        ansible_password:     "{{ vsrx_password }}"
        ansible_connection:   netconf
        ansible_network_os:   junos
        ansible_netconf_port: 830

    - name: Query Morpheus for all AppTier-tagged instances
      uri:
        url: "https://{{ morpheus_ip }}/api/instances?tagName=AppTier&max=500"
        method: GET
        headers:
          Authorization: "Bearer {{ morpheus_token }}"
        validate_certs: no
      register: morpheus_result

    - name: Build desired IP lists from Morpheus response
      set_fact:
        web_ips: "{{ morpheus_result.json | json_query(web_q) | reject('none') | list }}"
        db_ips:  "{{ morpheus_result.json | json_query(db_q)  | reject('none') | list }}"
      vars:
        web_q: "instances[?tags[?name=='AppTier' && value=='Web']].connectionInfo[0].ip"
        db_q:  "instances[?tags[?name=='AppTier' && value=='DB']].connectionInfo[0].ip"

    - name: Debug desired state
      debug:
        msg:
          WEB: "{{ web_ips }}"
          DB:  "{{ db_ips }}"


# ── Phase 2 ── Read actual state from the SRX via NETCONF ────────────────────
- name: Phase 2 — Read actual state from SRX
  hosts: vsrx
  gather_facts: no
  collections:
    - junipernetworks.junos

  tasks:

    # Use structured XML via NETCONF rather than scraping CLI text output.
    # filter_xml narrows the reply to just our address-book stanza so we
    # don't have to parse the entire security config.
    - name: Fetch MORPHEUS_MANAGED address-book config (XML)
      junipernetworks.junos.junos_command:
        commands:
          - "show configuration security address-book MORPHEUS_MANAGED | display xml"
      register: srx_xml_raw

    # The parse_srx_address_book filter lives in
    # filter_plugins/topology_filters.py — see that file for the xpath logic.
    - name: Parse XML into current IP sets
      set_fact:
        srx_web_ips: "{{ srx_xml_raw.stdout[0] | parse_srx_address_book('SET_WEB') }}"
        srx_db_ips:  "{{ srx_xml_raw.stdout[0] | parse_srx_address_book('SET_DB') }}"

    - name: Compute deltas
      set_fact:
        web_to_add:    "{{ hostvars['localhost']['web_ips'] | difference(srx_web_ips) }}"
        web_to_remove: "{{ srx_web_ips | difference(hostvars['localhost']['web_ips']) }}"
        db_to_add:     "{{ hostvars['localhost']['db_ips']  | difference(srx_db_ips) }}"
        db_to_remove:  "{{ srx_db_ips  | difference(hostvars['localhost']['db_ips']) }}"

    - name: Debug deltas
      debug:
        msg:
          - "WEB  add={{ web_to_add }}    remove={{ web_to_remove }}"
          - "DB   add={{ db_to_add }}     remove={{ db_to_remove }}"


# ── Phase 2.5 ── Promote vsrx facts to localhost scope ───────────────────────
# Explicit fact promotion replaces the fragile add_host variable-passing trick.
- name: Phase 2.5 — Promote vsrx deltas to localhost
  hosts: localhost
  gather_facts: no

  tasks:

    - name: Pull delta facts from vsrx hostvars
      set_fact:
        web_to_add:    "{{ hostvars['vsrx']['web_to_add'] }}"
        web_to_remove: "{{ hostvars['vsrx']['web_to_remove'] }}"
        db_to_add:     "{{ hostvars['vsrx']['db_to_add'] }}"
        db_to_remove:  "{{ hostvars['vsrx']['db_to_remove'] }}"


# ── Phase 3 ── Enforce desired state on SRX ──────────────────────────────────
- name: Phase 3 — Enforce desired state on SRX
  hosts: vsrx
  gather_facts: no
  collections:
    - junipernetworks.junos

  tasks:

    - name: Add new WEB IPs
      junipernetworks.junos.junos_config:
        lines:
          - "set security address-book MORPHEUS_MANAGED address {{ item }} {{ item }}/32"
          - "set security address-book MORPHEUS_MANAGED address-set SET_WEB address {{ item }}"
      loop: "{{ web_to_add }}"
      when: web_to_add | length > 0

    - name: Add new DB IPs
      junipernetworks.junos.junos_config:
        lines:
          - "set security address-book MORPHEUS_MANAGED address {{ item }} {{ item }}/32"
          - "set security address-book MORPHEUS_MANAGED address-set SET_DB address {{ item }}"
      loop: "{{ db_to_add }}"
      when: db_to_add | length > 0

    - name: Remove stale WEB IPs
      junipernetworks.junos.junos_config:
        lines:
          - "delete security address-book MORPHEUS_MANAGED address-set SET_WEB address {{ item }}"
          - "delete security address-book MORPHEUS_MANAGED address {{ item }}"
      loop: "{{ web_to_remove }}"
      when: web_to_remove | length > 0

    - name: Remove stale DB IPs
      junipernetworks.junos.junos_config:
        lines:
          - "delete security address-book MORPHEUS_MANAGED address-set SET_DB address {{ item }}"
          - "delete security address-book MORPHEUS_MANAGED address {{ item }}"
      loop: "{{ db_to_remove }}"
      when: db_to_remove | length > 0

    - name: No-op confirmation — SRX already matches desired state
      debug:
        msg: "Zero-impact run — SRX already matches Morpheus desired state."
      when:
        - web_to_add    | length == 0
        - web_to_remove | length == 0
        - db_to_add     | length == 0
        - db_to_remove  | length == 0

    - name: Validate — show final SRX address-book
      junipernetworks.junos.junos_command:
        commands:
          - "show configuration security address-book MORPHEUS_MANAGED | display xml"
      register: validation

    - name: Print final SRX state
      debug:
        msg: "{{ validation.stdout_lines }}"


# ── Phase 4 ── Build and publish topology snapshot for Grafana ───────────────
- name: Phase 4 — Publish topology snapshot
  hosts: localhost
  connection: local
  gather_facts: no

  tasks:

    # build_topology is a custom filter in filter_plugins/topology_filters.py.
    # It takes all four IP lists and the SRX IP and returns a clean dict with
    # nodes[] and edges[] — no Jinja2 string interpolation required here.
    - name: Build topology dict
      set_fact:
        topology: >-
          {{ (web_ips, db_ips, web_to_add, db_to_add, vsrx_ip)
             | build_topology }}

    - name: Push topology.json to fileserver via HTTP PUT
      uri:
        url:         "{{ fileserver_url }}/topology.json"
        method:      PUT
        body:        "{{ topology | to_nice_json }}"
        body_format: raw
        headers:
          Content-Type: application/json
        validate_certs: no
        status_code: [200, 201, 204]

    - name: Confirm topology published
      debug:
        msg: "Topology pushed to {{ fileserver_url }}/topology.json"
---
- name: Setup dynamic inventory and gather data
  hosts: localhost
  gather_facts: no

  vars:
    morpheus_url: "https://{{ morpheus_ip }}"

  tasks:

    - name: Add vSRX to inventory dynamically
      add_host:
        name: vsrx
        ansible_host: "{{ vsrx_ip }}"
        ansible_user: admin
        ansible_password: "{{ vsrx_password }}"
        ansible_connection: netconf
        ansible_network_os: junos
        ansible_netconf_port: 830

    - name: Query Morpheus for Web-tagged VMs
      uri:
        url: "{{ morpheus_url }}/api/instances?tags=AppTier:Web&max=500"
        method: GET
        headers:
          Authorization: "Bearer {{ morpheus_token }}"
        validate_certs: no
      register: web_result

    - name: Query Morpheus for DB-tagged VMs
      uri:
        url: "{{ morpheus_url }}/api/instances?tags=AppTier:DB&max=500"
        method: GET
        headers:
          Authorization: "Bearer {{ morpheus_token }}"
        validate_certs: no
      register: db_result

    - name: Build IP lists
      set_fact:
        web_ips: "{{ web_result.json.instances | map(attribute='connectionInfo') | map(attribute='0') | map(attribute='ip') | list }}"
        db_ips: "{{ db_result.json.instances | map(attribute='connectionInfo') | map(attribute='0') | map(attribute='ip') | list }}"

    - name: Print IPs found for debugging
      debug:
        msg:
          - "Web IPs from Morpheus: {{ web_ips }}"
          - "DB IPs from Morpheus: {{ db_ips }}"

    - name: Pass IP lists to vsrx host
      add_host:
        name: vsrx
        web_ips: "{{ web_ips }}"
        db_ips: "{{ db_ips }}"

- name: SAIL - Enforce state on SRX
  hosts: vsrx
  gather_facts: no
  collections:
    - junipernetworks.junos

  tasks:

    - name: Validate - show current SRX address book
      junipernetworks.junos.junos_command:
        commands:
          - show configuration security address-book MORPHEUS_MANAGED | display set
      register: validation

    - name: Print SRX state to log
      debug:
        msg: "{{ validation.stdout_lines }}"
